name: POC Cost Analysis
run-name: POC Cost Analysis - ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Try revision (12–40 hexadecimal characters) or Treeherder try URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-access:
    name: Verify RelOps User Access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate actor and rerun actor against relops.json
        run: python3 ci/check_authorized_user.py

  report:
    name: POC Cost Analysis Report
    needs: check-access
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: azure-pricing-${{ github.repository }}
      cancel-in-progress: false
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_PRICE_CACHE_DIR: .azure-price-cache
      HAS_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore shared Azure price cache
        id: azure-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .azure-price-cache
          key: azure-pricing-v1-${{ vars.AZURE_SUBSCRIPTION_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: azure-pricing-v1-${{ vars.AZURE_SUBSCRIPTION_ID }}-
      - name: Run tests
        run: python3 -m unittest -q
      - name: Azure service principal login
        if: env.HAS_AZURE_CREDENTIALS == 'true'
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Generate table and caveats
        env:
          TRY_REVISION: ${{ inputs.revision }}
        run: python3 workflow_report.py analysis "$TRY_REVISION"
      - name: Save shared Azure price cache
        if: ${{ !cancelled() && hashFiles('.azure-price-cache/*.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .azure-price-cache
          key: ${{ steps.azure-cache.outputs.cache-primary-key }}
      - name: Upload report and CSV tables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poc-cost-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
